model:
  default_path: weights/face_mobs.pt
  confidence_threshold: 0.3
  iou_threshold: 0.45
  device: auto
  tiled_inference:
    enabled: true
    size: 640
    stride: 256
    exclude_regions: []
  missed_detection_debug:
    enabled: true
    confidence: 0.05
    interval: 2.0
    save_dir: debug_missed
overlay:
  enabled: true
  click_through: true
player:
  model_path: weights/player.pt
  model_confidence: 0.22
  model_fallback_confidence: 0.15
  model_imgsz: 640
  miss_tolerance: 0.5
  model_iou: 0.45
  template_path: assets/player_templates
  match_threshold: 0.55
  match_scales:
  - 1.0
  - 0.95
  - 1.05
  - 0.9
  - 1.1
  - 0.85
  - 1.15
  front_distance: 200
  group_attack_distance: 130
  group_attack_min_targets: 2
  group_attack_key: ctrl
  turn_delay: 0.15
  turn_cooldown: 0.4
  initial_facing: right
  same_platform_max_dy: 45
  min_confirm_frames: 2
  max_missed_frames: 2
  target_match_distance: 90
  mock:
    enabled: false
    facing: right
    confidence: 1.0
    bbox: []
window:
  default:
    left: 20
    top: 151
    width: 788
    height: 374
  presets:
    small:
      left: 100
      top: 100
      width: 640
      height: 480
    medium:
      left: 100
      top: 100
      width: 800
      height: 600
    large:
      left: 100
      top: 100
      width: 1200
      height: 800
    fullhd:
      left: 0
      top: 100
      width: 1920
      height: 980
    qhd:
      left: 320
      top: 180
      width: 1280
      height: 720
controls:
  pickup_key: space
  interact_key: space
  attack_key: alt
  attack_method: key
  movement_keys:
    left: left
    right: right
    jump: x
    up: up
    down: down
  skill_keys:
    skill_1: ctrl
    skill_2: '1'
    skill_3: '2'
    skill_4: '3'
    potion: delete
  system_keys:
    inventory: i
    status: s
    chat: enter
automation:
  action_delay: 0.3
  attack_cooldown: 0.5
  stuck_reposition_after: 3.0
  scan_interval: 0.1
  max_detection_distance: 200
  priority_targets:
  - 木面怪人
  - 石面怪人
  - mob
  mob_hunting:
    enable: false
    search_pattern: horizontal
    move_distance: 100
    search_delay: 2.0
    max_search_time: 10
    return_to_center: true
safety:
  enable_failsafe: true
  emergency_stop_corner: true
  max_runtime_hours: 2
  screenshot_log: false
monitoring:
  log_level: INFO
  save_interval: 30
  max_log_size_mb: 100
  enable_performance_monitor: true
detection_behavior:
  character:
    action: ignore
    log: true
  environment:
    action: ignore
    log: false
  item:
    action: ignore
    log: true
    max_distance: 150
  mob:
    action: attack
    log: true
    max_distance: 200
    attack_delay: 0.15
  木面怪人:
    action: attack
    log: true
    max_distance: 200
    attack_delay: 0.15
  石面怪人:
    action: attack
    log: true
    max_distance: 200
    attack_delay: 0.15
  npc:
    action: ignore
    log: true
    interaction_delay: 1.0
  ui:
    action: ignore
    log: false
