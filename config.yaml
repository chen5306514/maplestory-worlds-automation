# MapleStory Worlds 自動化系統配置文件

# 模型設定
model:
  default_path: "weights/face_mobs.pt"
  confidence_threshold: 0.3  # 分塊推理後保留被輕度遮擋的目標
  iou_threshold: 0.45
  device: "auto"  # auto, cpu, cuda
  tiled_inference:
    enabled: true
    size: 640
    stride: 256
    exclude_regions: []

# 角色定位與方向判斷
player:
  model_path: "weights/player.pt"
  model_confidence: 0.22
  model_fallback_confidence: 0.15
  model_imgsz: 640
  miss_tolerance: 0.5
  model_iou: 0.45
  template_path: "assets/player_templates"
  match_threshold: 0.55
  match_scales: [1.0, 0.95, 1.05, 0.90, 1.10, 0.85, 1.15]
  front_distance: 200
  group_attack_distance: 130
  group_attack_min_targets: 2
  group_attack_key: "ctrl"
  turn_delay: 0.15
  turn_cooldown: 0.4
  initial_facing: "right"  # right 或 left
  same_platform_max_dy: 45
  min_confirm_frames: 2
  max_missed_frames: 2
  target_match_distance: 90

# 視窗設定
window:
  default:
    left: 268
    top: 385
    width: 430
    height: 162
  # 預設遊戲視窗位置（可根據不同解析度調整）
  presets:
    small:
      left: 100
      top: 100
      width: 640
      height: 480
    medium:
      left: 100
      top: 100
      width: 800
      height: 600
    large:
      left: 100
      top: 100
      width: 1200
      height: 800
    fullhd:
      left: 0
      top: 100
      width: 1920
      height: 980
    qhd:
      left: 320
      top: 180
      width: 1280
      height: 720

# 按鍵設定 (根據您的遊戲配置更新)
controls:
  pickup_key: "space"       # 撿取物品按鍵 (請確認)
  interact_key: "space"     # 與 NPC 互動按鍵
  attack_key: "alt"         # 攻擊按鍵
  attack_method: "key"      # 攻擊方式：使用 Z 鍵攻擊
  
  # 移動按鍵
  movement_keys:
    left: "left"           # 向左移動
    right: "right"         # 向右移動
    jump: "x"              # 跳躍 (X 鍵)
    up: "up"               # 向上 (爬繩/梯子)
    down: "down"           # 向下 (跳下平台)
  
  # 技能和動作按鍵
  skill_keys:
    skill_1: "ctrl"        # 技能1
    skill_2: "1"           # 技能2  
    skill_3: "2"           # 技能3
    skill_4: "3"           # 技能4
    potion: "delete"       # 藥水
    
  # 系統按鍵
  system_keys:
    inventory: "i"         # 背包
    status: "s"           # 狀態視窗
    chat: "enter"         # 聊天

# 自動化行為設定
automation:
  action_delay: 0.3  # 動作間隔秒數
  attack_cooldown: 0.35  # 兩次攻擊之間的最小間隔
  scan_interval: 0.1  # 每次螢幕擷取/識別的目標週期
  max_detection_distance: 200  # 最大偵測距離
  priority_targets: ["木面怪人", "石面怪人", "mob"]  # 優先攻擊新模型類別
  
  # 尋找怪物設定
  mob_hunting:
    enable: true  # 啟用主動尋找怪物
    search_pattern: "horizontal"  # 搜尋模式: horizontal, vertical, random
    move_distance: 100  # 每次移動距離 (像素)
    search_delay: 2.0  # 搜尋間隔 (秒)
    max_search_time: 10  # 最大搜尋時間 (秒)
    return_to_center: true  # 搜尋後是否返回中心
  
# 安全設定
safety:
  enable_failsafe: true
  emergency_stop_corner: true
  max_runtime_hours: 2  # 最大連續運行時間
  screenshot_log: false  # 是否保存截圖日誌

# 監控設定
monitoring:
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_interval: 30  # 監控數據保存間隔（秒）
  max_log_size_mb: 100
  enable_performance_monitor: true

# 偵測行為設定
detection_behavior:
  character:
    action: "ignore"
    log: true
  environment:
    action: "ignore"
    log: false
  item:
    action: "ignore"     # 只偵測不執行動作
    log: true
    max_distance: 150
  mob:
    action: "attack"     # 只保留攻擊怪物
    log: true
    max_distance: 200
    attack_delay: 0.15
  木面怪人:
    action: "attack"
    log: true
    max_distance: 200
    attack_delay: 0.15
  石面怪人:
    action: "attack"
    log: true
    max_distance: 200
    attack_delay: 0.15
  npc:
    action: "ignore"     # 只偵測不執行動作
    log: true
    interaction_delay: 1.0
  ui:
    action: "ignore"
    log: false 
